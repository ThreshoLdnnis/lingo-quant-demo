[project]
name = "lingyu-quant-system"
version = "0.1.0"
description = "Lingyu Quant System: A-share alpha research, data lake, vectorized backtesting, and professional terminal UI."
requires-python = ">=3.10"
dependencies = [
  "akshare>=1.16",
  "numpy>=1.23.5,<1.24",
  "openai>=1.53",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
market = ["akshare>=1.16"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
